<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="vectorBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141c24" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="100%" stop-color="#080a0e" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="vectorBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="goldPen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d4a020"/>
    </linearGradient>
    <filter id="penGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#vectorBg)"/>

  <!-- Blueprint Drafting Grid -->
  <g opacity="0.1" stroke="#3b82f6" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- Vector Shield / Falcon Crest with Bezier Curves -->
  <g transform="translate(400, 200)" filter="url(#penGlow)">
    <!-- Base Shield Curve -->
    <path d="M 0 -85 C 45 -85, 75 -55, 75 0 C 75 60, 0 100, 0 100 C 0 100, -75 60, -75 0 C -75 -55, -45 -85, 0 -85 Z" 
          fill="none" stroke="url(#vectorBlue)" stroke-width="3"/>
    
    <!-- Inner Stylized Wing Shape -->
    <path d="M 0 -60 C 25 -30, 40 0, 0 50 C -40 0, -25 -30, 0 -60 Z"
          fill="rgba(59, 130, 246, 0.15)" stroke="url(#vectorBlue)" stroke-width="2"/>

    <!-- Tangent / Bezier Handle Lines -->
    <line x1="45" y1="-85" x2="105" y2="-85" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="-45" y1="-85" x2="-105" y2="-85" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="75" y1="0" x2="75" y2="-45" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="75" y1="0" x2="75" y2="45" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Control Handle Dots -->
    <circle cx="105" cy="-85" r="4" fill="#60a5fa"/>
    <circle cx="-105" cy="-85" r="4" fill="#60a5fa"/>
    <circle cx="75" cy="-45" r="4" fill="#60a5fa"/>
    <circle cx="75" cy="45" r="4" fill="#60a5fa"/>
    
    <!-- Vector Anchor Points (Squares) -->
    <rect x="-4" y="-89" width="8" height="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="71" y="-4" width="8" height="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="-79" y="-4" width="8" height="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="-4" y="96" width="8" height="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  </g>

  <!-- Pen Tool Icon Actively Drawing Anchor Point -->
  <g transform="translate(480, 195) rotate(-35)" filter="url(#penGlow)">
    <path d="M 0 0 L -8 30 L 0 45 L 8 30 Z" fill="url(#goldPen)"/>
    <rect x="-10" y="45" width="20" height="25" rx="3" fill="#1e293b" stroke="url(#goldPen)" stroke-width="1.5"/>
    <circle cx="0" cy="18" r="3" fill="#ffffff"/>
    <line x1="0" y1="0" x2="0" y2="18" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Label Badge -->
  <g transform="translate(400, 375)">
    <rect x="-120" y="-16" width="240" height="32" rx="16" fill="#0f172a" stroke="#2563eb" stroke-width="1.2"/>
    <text text-anchor="middle" y="5" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
      VETORIZAÇÃO TÉCNICA · AI / CDR
    </text>
  </g>
</svg>
