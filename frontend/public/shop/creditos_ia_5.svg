<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1808" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0e0e11" stop-opacity="1"/>
      <stop offset="100%" stop-color="#08080a" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#d4a020"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGlow)"/>

  <!-- Subtle Perspective Grid -->
  <g opacity="0.12" stroke="#d4a020" stroke-width="1">
    <line x1="100" y1="450" x2="350" y2="220"/>
    <line x1="250" y1="450" x2="380" y2="220"/>
    <line x1="400" y1="450" x2="400" y2="220"/>
    <line x1="550" y1="450" x2="420" y2="220"/>
    <line x1="700" y1="450" x2="450" y2="220"/>
    <line x1="200" y1="360" x2="600" y2="360"/>
    <line x1="280" y1="300" x2="520" y2="300"/>
    <line x1="330" y1="260" x2="470" y2="260"/>
  </g>

  <!-- Central AI Neural Core -->
  <g transform="translate(400, 210)" filter="url(#neonGlow)">
    <!-- Outer Orbit Ring -->
    <circle r="95" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.6"/>
    <circle r="75" fill="none" stroke="url(#cyanGrad)" stroke-width="2" opacity="0.8"/>
    
    <!-- Central Shield / Processor -->
    <rect x="-42" y="-42" width="84" height="84" rx="20" fill="#141416" stroke="url(#goldGrad)" stroke-width="2.5"/>
    
    <!-- Core Icon: Sparkles & Brain Nodes -->
    <path d="M0 -22 L6 -6 L22 0 L6 6 L0 22 L-6 6 L-22 0 L-6 -6 Z" fill="url(#goldGrad)"/>
    <circle cx="-28" cy="-28" r="4" fill="#38bdf8"/>
    <circle cx="28" cy="-28" r="4" fill="#38bdf8"/>
    <circle cx="-28" cy="28" r="4" fill="#38bdf8"/>
    <circle cx="28" cy="28" r="4" fill="#38bdf8"/>

    <!-- Connecting Bus Lines -->
    <line x1="-42" y1="-20" x2="-65" y2="-20" stroke="#38bdf8" stroke-width="2"/>
    <line x1="-42" y1="20" x2="-65" y2="20" stroke="#38bdf8" stroke-width="2"/>
    <line x1="42" y1="-20" x2="65" y2="-20" stroke="#38bdf8" stroke-width="2"/>
    <line x1="42" y1="20" x2="65" y2="20" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Scanning Hologram Beam -->
  <path d="M 320 120 L 480 120 L 530 310 L 270 310 Z" fill="url(#cyanGrad)" opacity="0.08"/>
  <line x1="300" y1="230" x2="500" y2="230" stroke="#38bdf8" stroke-width="2" opacity="0.7" filter="url(#neonGlow)"/>

  <!-- Badge / Text Overlay -->
  <g transform="translate(400, 375)">
    <rect x="-110" y="-16" width="220" height="32" rx="16" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text text-anchor="middle" y="5" fill="#f4f4f5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
      5 CRÉDITOS IA · SCANNER
    </text>
  </g>
</svg>
