<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow15" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#231734" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#110d1a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#08070d" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d4a020"/>
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGlow15)"/>

  <!-- Neural Network Connections -->
  <g opacity="0.25" stroke="#a855f7" stroke-width="1.2">
    <line x1="200" y1="120" x2="330" y2="190"/>
    <line x1="220" y1="280" x2="330" y2="230"/>
    <line x1="600" y1="120" x2="470" y2="190"/>
    <line x1="580" y1="280" x2="470" y2="230"/>
    <line x1="330" y1="190" x2="400" y2="210"/>
    <line x1="470" y1="190" x2="400" y2="210"/>
    <line x1="330" y1="230" x2="400" y2="210"/>
    <line x1="470" y1="230" x2="400" y2="210"/>
    <circle cx="200" cy="120" r="5" fill="#c084fc"/>
    <circle cx="220" cy="280" r="5" fill="#c084fc"/>
    <circle cx="600" cy="120" r="5" fill="#c084fc"/>
    <circle cx="580" cy="280" r="5" fill="#c084fc"/>
  </g>

  <!-- Central Super Processor -->
  <g transform="translate(400, 205)" filter="url(#purpleGlow)">
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="none" stroke="url(#purpleGrad)" stroke-width="2"/>
    <circle r="50" fill="#171124" stroke="url(#goldGrad2)" stroke-width="2"/>
    
    <!-- AI Brain & Speed Pulse -->
    <path d="M-15,-20 C-25,-10 -25,10 -15,20 C-5,25 0,15 0,0 C0,-15 -5,-25 -15,-20 Z" fill="url(#purpleGrad)" opacity="0.8"/>
    <path d="M15,-20 C25,-10 25,10 15,20 C5,25 0,15 0,0 C0,-15 5,-25 15,-20 Z" fill="url(#goldGrad2)" opacity="0.9"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
  </g>

  <g transform="translate(400, 375)">
    <rect x="-115" y="-16" width="230" height="32" rx="16" fill="#181424" stroke="#7e22ce" stroke-width="1.2"/>
    <text text-anchor="middle" y="5" fill="#e9d5ff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
      15 CRÉDITOS IA · PRO PACK
    </text>
  </g>
</svg>
